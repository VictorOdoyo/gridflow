[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "gridflow"
version = "1.0.0"
description = "AC and DC load flow with transparent network models"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
license = "MIT"
authors = [{name = "Victor Odoyo"}]
[project.scripts]
gridflow = "gridflow.cli:main"
[tool.setuptools.packages.find]
include = ["gridflow*"]
[tool.setuptools.package-data]
gridflow = ["web/*", "examples/*.json"]
